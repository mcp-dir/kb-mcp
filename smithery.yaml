# Smithery configuration for Base de Conhecimento
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_kb

name: kb-mcp
displayName: "Base de Conhecimento"
description: >
  Sua base de conhecimento privada: suba documentos (.md, .txt, .docx, PDF, imagens), a plataforma indexa tudo semanticamente e o agente busca o contexto relevante na hora. Ideal pra escritórios. Cada base é isolada, o conteúdo fica criptografado na plataforma. Você paga só pelo que armazena.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/kb-mcp
repository: https://github.com/mcp-dir/kb-mcp

tags:
  - kb
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_kb

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_kb/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
